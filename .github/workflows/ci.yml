name: Milestone Python checks
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milestone-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.24"
      - run: uv sync --frozen --python 3.15.2
      - run: uv run --frozen python scripts/check.py
